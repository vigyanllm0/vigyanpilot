<script>
(async function() {
  const slug = window.location.pathname.replace(/^\/blog\//, '').replace(/\/$/, '');
  if (!slug) { document.getElementById('mainContent').innerHTML = '<div class="error-page"><h2>Post Not Found</h2><p>No blog post specified.</p><a href="/blog">Back to Blog</a></div>'; return; }
  const heroContent = document.getElementById('heroContent');
  const mainContent = document.getElementById('mainContent');
  const badge = document.getElementById('postBadge');
  const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8001' : '';

  try {
    const res = await fetch(API_BASE + '/api/v1/cms/pages/' + slug);
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    const page = data.data;

    document.title = page.title + ' — VigyanLLM';
    let metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc && page.description) metaDesc.setAttribute('content', page.description);

    heroContent.innerHTML = '<h1>' + page.title + '</h1>' + (page.description ? '<p>' + page.description + '</p>' : '');
    badge.textContent = page.published_at ? new Date(page.published_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : 'Published';

    let imgHtml = '';
    if (page.hero_image) imgHtml = '<img src="' + page.hero_image + '" alt="" class="hero-img" loading="lazy" loading="lazy">';
    mainContent.innerHTML = '<article class="article-body">' + imgHtml + (page.content_html || '<p>No content</p>') + '</article>';

    // OG tags
    ['og:title','og:description','og:url','og:type','twitter:card'].forEach(p => {
      let el = document.querySelector('meta[property="'+p+'"]');
      if (!el) { el = document.createElement('meta'); el.setAttribute('property',p); document.head.appendChild(el); }
      if (p === 'og:title') el.setAttribute('content', page.title + ' — VigyanLLM');
      else if (p === 'og:description') el.setAttribute('content', page.description || '');
      else if (p === 'og:url') el.setAttribute('content', 'https://www.vigyanllm.in/blog/' + slug);
      else if (p === 'og:type') el.setAttribute('content', 'article');
      else if (p === 'twitter:card') el.setAttribute('content', 'summary_large_image');
    });
  } catch(e) {
    heroContent.innerHTML = '';
    badge.textContent = 'VigyanLLM Blog';
    mainContent.innerHTML = '<div class="error-page"><h2>Post Not Found</h2><p>This blog post doesn\'t exist or hasn\'t been published yet.</p><a href="/blog">Back to Blog</a></div>';
    document.title = 'Post Not Found — VigyanLLM';
  }

  const body = mainContent.querySelector('.article-body');
  if (body) {
    body.querySelectorAll('script,iframe,object,embed').forEach(function(el) { el.remove(); });
    body.querySelectorAll('*[onclick],[onload],[onerror],[onmouseover]').forEach(function(el) {
      ['onclick','onload','onerror','onmouseover','onmouseout','onchange','onsubmit'].forEach(function(a) { el.removeAttribute(a); });
    });
  }
})();
</script>
<!-- Auth Modal -->
<div class="auth-overlay" id="authOverlay" onclick="if(event.target===this)closeAuthModal()">
  <div class="auth-modal" id="authModal">
    <button type="button" class="close-btn" onclick="closeAuthModal()">&times;</button>
    <h2 id="authTitle">Sign in</h2>
    <p class="sub" id="authSub">Access your VigyanLLM account</p>
    <div id="authError" class="auth-err"></div>
    <form id="authForm" onsubmit="return handleAuth(event)">
      <div class="field" id="nameField" style="display:none">
        <label for="authName">Full name</label>
        <input type="text" id="authName" placeholder="Dr. A.P.J. Abdul Kalam" autocomplete="name">
      </div>
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="researcher@institution.edu" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="authPass">Password</label>
        <input type="password" id="authPass" placeholder="Min 8 characters" autocomplete="current-password" required minlength="8">
      </div>
      <button type="submit" class="auth-btn" id="authSubmit">Sign in</button>
    </form>
    <p class="toggle-link" id="authToggle">Don't have an account? <a onclick="toggleAuthMode()">Register</a></p>
  </div>
</div>
<script>
var AUTH_MODE='login';
function openAuthModal(){document.getElementById('authOverlay').classList.add('open');document.body.style.overflow='hidden'}
function closeAuthModal(){document.getElementById('authOverlay').classList.remove('open');document.body.style.overflow=''}
function toggleAuthMode(){AUTH_MODE=AUTH_MODE==='login'?'register':'login';var t=document.getElementById('authTitle'),s=document.getElementById('authSub'),b=document.getElementById('authSubmit'),n=document.getElementById('nameField'),tg=document.getElementById('authToggle');if(AUTH_MODE==='register'){t.textContent='Create account';s.textContent='Join VigyanLLM — free for Indian academic institutions';b.textContent='Create account';n.style.display='block';tg.innerHTML="Already have an account? <a onclick=\"toggleAuthMode()\">Sign in</a>"}else{t.textContent='Sign in';s.textContent='Access your VigyanLLM account';b.textContent='Sign in';n.style.display='none';tg.innerHTML="Don't have an account? <a onclick=\"toggleAuthMode()\">Register</a>"}document.getElementById('authError').style.display='none'}
async function handleAuth(e){e.preventDefault();var err=document.getElementById('authError');err.style.display='none';var email=document.getElementById('authEmail').value;var pass=document.getElementById('authPass').value;if(pass.length<8){err.textContent='Password must be at least 8 characters';err.style.display='block';return false}try{var api=window.VIGYAN_BACKEND_URL||'/api';var ep=AUTH_MODE==='login'?'/auth/login':'/auth/register';var body={email:email,password:pass};if(AUTH_MODE==='register'){body.name=document.getElementById('authName').value||'User';body.consent_accepted=true}var r=await fetch(api+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(!r.ok){err.textContent=d.error||'Authentication failed';err.style.display='block';return false}if(d.requires_verification){err.textContent=d.message||'Account created! Check your email to verify.';err.style.display='block';return false}closeAuthModal();window.location.reload()}catch(a){err.textContent='Network error. Please try again.';err.style.display='block'}return false}
</script>
