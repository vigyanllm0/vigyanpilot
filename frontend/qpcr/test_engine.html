<!DOCTYPE html>
<html>
<head><title>Engine Test</title></head>
<body>
<pre id="out"></pre>
<script type="module">
import { parseRun, detectFormat, analyzeRun } from './qpcr-engine.js';

const out = document.getElementById('out');
const tests = [];

// Test 1: detect format
const rdml = `<?xml version="1.0"?><rdml><run><react><position>A1</position><sample>NTC</sample><target>GAPDH</target><dye>FAM</dye><cq>38.5</cq></react></run></rdml>`;
tests.push(['detect rdml', detectFormat(rdml) === 'rdml']);

// Test 2: parse rdml
const run = parseRun(rdml, 'test.xml');
tests.push(['parse rdml wells', run.wells.length === 1]);
tests.push(['parse rdml sample', run.samples[0].name === 'NTC']);
tests.push(['parse rdml channel', run.channels[0].canonical === 'FAM']);
tests.push(['parse rdml cq', run.wells[0].cq === 38.5]);

// Test 3: canonical channel
import { canonicalChannel } from './qpcr-engine.js';
tests.push(['canonical SYBR', canonicalChannel('SYBR Green') === 'FAM']);
tests.push(['canonical VIC', canonicalChannel('VIC') === 'HEX']);

// Test 4: linear regression
import { linearRegression } from './qpcr-engine.js';
const reg = linearRegression([1,2,3,4,5], [2,4,6,8,10]);
tests.push(['linreg slope', Math.abs(reg.slope - 2) < 1e-9]);
tests.push(['linreg r2', Math.abs(reg.r2 - 1) < 1e-9]);

let result = '';
let passed = 0;
for (const [name, ok] of tests) {
  result += (ok ? 'PASS' : 'FAIL') + ' ' + name + '\n';
  if (ok) passed++;
}
result += `\n${passed}/${tests.length} passed`;
out.textContent = result;
console.log(result);
</script>
</body>
</html>
