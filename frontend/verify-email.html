<meta name="google-site-verification" content="WP61CgW3hd6FNvLabkXLmVU0rNzXpkK8ynYRxr5FqBo">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Email — VigyanLLM</title>
<link rel="stylesheet" href="/design-tokens.css">
<meta name="theme-color" content="#0F172A">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1565C0;--blue-light:#42A5F5;--blue-bg:#E3F2FD;--navy:#0F172A;--surface:#FFFFFF;--surface-alt:#F5F7FA;--outline:#E2E5EA;--text:#0A0A0F;--text2:#4A4A6A;--muted:#7A7A9A;--primary:#2563EB;--font-h:'Montserrat',sans-serif;--font-b:'Open Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-alt);color:var(--text);font-family:var(--font-b);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
.verify-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.verify-card{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:48px 40px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06);border:1px solid var(--outline)}
.verify-card .logo{width:64px;height:64px;border-radius:12px;margin:0 auto 20px}
.verify-card h1{font-family:var(--font-h);font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px}
.verify-card .subtitle{color:var(--muted);font-size:14px;margin-bottom:28px}
.verify-card .icon-wrap{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px}
.verify-card .icon-wrap.loading{background:#E3F2FD;color:var(--blue);animation:pulse 1.5s infinite}
.verify-card .icon-wrap.success{background:#DCFCE7;color:#16A34A}
.verify-card .icon-wrap.error{background:#FEE2E2;color:#DC2626}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.verify-card .msg{font-size:15px;color:var(--text2);line-height:1.6;margin-bottom:28px}
.verify-card .msg strong{color:var(--text)}
.btn{display:inline-block;padding:12px 28px;border-radius:8px;font-family:var(--font-h);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1258A8;box-shadow:0 4px 16px rgba(21,101,192,.3)}
.resend-section{margin-top:24px;padding-top:24px;border-top:1px solid var(--outline)}
.resend-section p{font-size:13px;color:var(--muted);margin-bottom:12px}
.resend-btn{background:none;border:1.5px solid var(--blue);color:var(--blue);padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.resend-btn:hover{background:var(--blue-bg)}
.resend-btn:disabled{color:var(--muted);border-color:var(--muted);cursor:default}
footer{background:var(--navy);padding:20px;text-align:center}
footer p{color:rgba(255,255,255,.4);font-size:12px}
footer a{color:var(--blue-light)}
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KRP5LLPR" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="verify-wrap">
  <div class="verify-card">
    <img src="logo.png" alt="VigyanLLM" class="logo" loading="lazy">
    <div class="icon-wrap loading" id="verifyIcon">&#8987;</div>
    <h1 id="verifyTitle">Verifying your email...</h1>
    <p class="msg" id="verifyMsg">Please wait while we confirm your email address.</p>
    <div id="verifyActions" style="display:none">
      <a href="/login" class="btn btn-primary">Sign in to VigyanLLM</a>
    </div>
    <div class="resend-section" id="resendSection" style="display:none">
      <p>Didn't receive the email?</p>
      <div style="display:flex;gap:8px;margin-top:8px;max-width:360px;margin-left:auto;margin-right:auto">
        <input type="email" id="resendEmail" placeholder="Your registered email" style="flex:1;padding:10px 12px;font-size:13px;border:1px solid #E2E8F0;border-radius:8px;font-family:var(--font-b)">
        <button class="resend-btn" id="resendBtn" onclick="doResend()">Resend</button>
      </div>
      <p id="resendMsg" style="margin-top:8px;display:none;font-size:13px"></p>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2026 VigyanLLM &middot; <a href="/">vigyanllm.in</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></p>
</footer>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var icon = document.getElementById('verifyIcon');
  var title = document.getElementById('verifyTitle');
  var msg = document.getElementById('verifyMsg');
  var actions = document.getElementById('verifyActions');
  var resendSection = document.getElementById('resendSection');

  if (!token) {
    icon.className = 'icon-wrap error';
    icon.innerHTML = '&#10006;';
    title.textContent = 'No verification link';
    msg.innerHTML = 'This page requires a verification token. Please check your email and click the verification link, or request a new one.';
    resendSection.style.display = 'block';
    return;
  }

  // Use POST to prevent token from appearing in browser history / server logs
  // Token is still in URL for email link, but the page reads it and sends via POST
  fetch('/api/auth/verify-email', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token: token})
  })
    .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, status: r.status, data: d}; }); })
    .then(function(res){
      if (res.ok && res.data && res.data.success) {
        icon.className = 'icon-wrap success';
        icon.innerHTML = '&#10004;';
        title.textContent = 'Email verified!';
        msg.innerHTML = '<strong>' + (res.data.message || 'Your email has been verified successfully.') + '</strong><br>You can now sign in to your account.';
        actions.style.display = 'block';
      } else {
        // Token might have been consumed by a previous call — try login hint
        icon.className = 'icon-wrap error';
        icon.innerHTML = '&#10006;';
        title.textContent = 'Verification issue';
        msg.innerHTML = 'This link may have already been used or expired.<br><strong>Try signing in</strong> — if your account was just verified, it should work.';
        actions.style.display = 'block';
        resendSection.style.display = 'block';
      }
    })
    .catch(function(e){
      // Network error — but verification might have worked server-side
      icon.className = 'icon-wrap error';
      icon.innerHTML = '&#10006;';
      title.textContent = 'Connection error';
      msg.innerHTML = 'Could not reach the server. <strong>Try signing in</strong> — your account may already be verified.';
      actions.style.display = 'block';
      resendSection.style.display = 'block';
    });
})();

function doResend(){
  var emailInput = document.getElementById('resendEmail');
  var email = emailInput ? emailInput.value.trim().toLowerCase() : '';
  if (!email) { if (emailInput) emailInput.focus(); return; }
  var btn = document.getElementById('resendBtn');
  var msg = document.getElementById('resendMsg');
  btn.disabled = true; btn.textContent = 'Sending...'; msg.style.display = 'none';
  fetch('/api/auth/resend-verification', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    msg.style.display = 'block'; msg.style.color = '#16A34A';
    msg.textContent = d.message || 'Verification email sent. Please check your inbox.';
    btn.textContent = 'Sent!'; btn.disabled = false;
  })
  .catch(function(){
    msg.style.display = 'block'; msg.style.color = '#DC2626';
    msg.textContent = 'Failed to send. Please try again.';
    btn.disabled = false; btn.textContent = 'Resend';
  });
}
</script>
</body>
</html>
