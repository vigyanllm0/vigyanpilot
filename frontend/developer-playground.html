    <h1>API Playground</h1>
    <p class="sub">Select an endpoint, fill in parameters, and send a live request.</p>
    <div class="pg-layout">
      <div class="pg-panel">
        <div class="pg-panel-head">Request</div>
        <div class="pg-panel-body">
          <div class="form-group">
            <label class="form-label">Endpoint</label>
            <select class="form-select" id="pg-endpoint" onchange="updateParams()">
              <option value="primer">POST /api/v1/primer/design</option>
              <option value="blast">POST /api/v1/blast/search</option>
              <option value="msa">POST /api/v1/msa/align</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">API Key</label>
            <input type="text" class="form-input" id="pg-apikey" placeholder="vly_sk_..." style="font-family:monospace;font-size:12px">
          </div>
          <div id="pg-params"></div>
          <button class="send-btn" id="pg-send" onclick="sendRequest()">Send Request</button>

<script defer src="/auth-shared.js"></script>
<script>
(function(){
var user=null;var history=JSON.parse(localStorage.getItem('pg_history')||'[]');
var params={
  primer:'<div class="form-group"><label class="form-label">Template Sequence (≥100 bp)</label><textarea class="form-textarea" id="pg-seq" placeholder="Paste DNA sequence...">ATGCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCG</textarea></div><div class="form-group"><label class="form-label">Organism</label><select class="form-select" id="pg-organism"><option value="human">Human</option><option value="mouse">Mouse</option><option value="ecoli">E. coli</option></select></div>',
  blast:'<div class="form-group"><label class="form-label">Query Sequence</label><textarea class="form-textarea" id="pg-blast-query" placeholder="DNA or protein sequence">GACCCCAAAATCAGCGAAAT</textarea></div><div class="form-group"><label class="form-label">Database</label><select class="form-select" id="pg-blast-db"><option value="nr">nr</option><option value="nt">nt</option></select></div>',
  msa:'<div class="form-group"><label class="form-label">Sequences (FASTA format)</label><textarea class="form-textarea" id="pg-msa-seq" placeholder=">seq1&#10;ATGCGATCGATCG&#10;>seq2&#10;ATGCAATCGATCG" style="min-height:140px">>seq1\nATGCGATCGATCGATCG\n>seq2\nATGCAATCGATCGATCG\n>seq3\nATGCGATCAATCGATCG</textarea></div>'
};
function updateParams(){document.getElementById('pg-params').innerHTML=params[document.getElementById('pg-endpoint').value]}
function checkAuth(){var pu=localStorage.getItem('pf_user');if(pu){user=JSON.parse(pu);document.getElementById('auth-gate').style.display='none';document.getElementById('pg-content').style.display='block';loadKeys()}else{document.getElementById('auth-gate').style.display='block';document.getElementById('pg-content').style.display='none'}}
function loadKeys(){fetch('/api/developer/keys',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){if(d.keys&&d.keys.length){document.getElementById('pg-apikey').value=d.keys[0].key_mask||''}})}
function renderHistory(){
var el=document.getElementById('pg-history');
if(!history.length){el.innerHTML='';return}
el.innerHTML='<div style="font-size:12px;font-weight:600;color:#64748B;margin-bottom:6px">Recent Requests</div>'+history.map(function(h,i){
return '<div class="history-item" onclick="loadHistory('+i+')"><span class="history-method" style="color:'+(h.method==='POST'?'#2563EB':'#059669')+'">'+h.method+'</span><span class="history-url">'+h.endpoint+'</span><span class="resp-status resp-'+h.status+'">'+h.status+'</span></div>'
}).join('')}
function sendRequest(){
var ep=document.getElementById('pg-endpoint').value;
var key=document.getElementById('pg-apikey').value.trim();
if(!key){alert('Enter an API key');return}
var body={};
if(ep==='primer'){body={sequence:document.getElementById('pg-seq').value,organism:document.getElementById('pg-organism').value}}
else if(ep==='blast'){body={query:document.getElementById('pg-blast-query').value,database:document.getElementById('pg-blast-db').value}}
else{body={sequences:document.getElementById('pg-msa-seq').value.split('\n').filter(function(l){return l.trim()})}}
var url='/api/v1/'+(ep==='primer'?'primer/design':ep==='blast'?'blast/search':'msa/align');
var btn=document.getElementById('pg-send');btn.disabled=true;btn.textContent='Sending...';
var start=Date.now();
fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}).then(function(r){
var elapsed=Date.now()-start;
document.getElementById('pg-resp-status').innerHTML='<span class="resp-status resp-'+r.status+'">'+r.status+' '+r.statusText+'</span>';
document.getElementById('pg-resp-meta').textContent='Time: '+elapsed+'ms';
return r.json()}).then(function(d){
document.getElementById('pg-resp-body').textContent=JSON.stringify(d,null,2);
document.getElementById('pg-resp-body').style.color='#E2E8F0';
history.unshift({method:'POST',endpoint:url,status:200});
if(history.length>10)history.pop();
localStorage.setItem('pg-history',JSON.stringify(history));renderHistory()}).catch(function(e){
document.getElementById('pg-resp-body').textContent='Error: '+e.message;
document.getElementById('pg-resp-body').style.color='#F87171'}).finally(function(){btn.disabled=false;btn.textContent='Send Request'});
}
window.sendRequest=sendRequest;window.updateParams=updateParams;
window.loadHistory=function(i){var h=history[i];document.getElementById('pg-endpoint').value=h.endpoint.includes('primer')?'primer':h.endpoint.includes('blast')?'blast':'msa';updateParams()};
checkAuth();updateParams();renderHistory();
})();
</script>
