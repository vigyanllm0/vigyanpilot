# Safety policy file - ignore known vulnerabilities in transitive dependencies
# These are in build tools or dependencies where upgrade would break compatibility
ignore:
  # setuptools <83.0.0 - Unicode normalization issue in sdist (build tool only)
  - id: SFTY-20260721-58460
    reason: "Build tool vulnerability; setuptools pinned for compatibility with pysam wheel build"
    expires: "2027-01-01"

  # fpdf2 2.8.2 - ReDoS in SVG transform parser (only used for PDF export)
  - id: PVE-2025-80915
    reason: "Only used for PDF report generation; SVG input is controlled/admin-generated"
    expires: "2027-01-01"