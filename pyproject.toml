[project]
name = "vigyanpilot"
version = "1.0.0"
description = "VigyanLLM Primer Design Platform"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["primerforge*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # naming
    "UP",   # pyupgrade
    "S",    # bandit security
    "BLE",  # blind except
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # allow assert
    "BLE001",  # blind except - existing codebase has many; address incrementally
    "S104",    # binding to all interfaces - intentional for dev server
    "S108",    # insecure temp file - dev DB path
    "S607",    # partial executable path - controlled env
    "S608",    # SQL injection - string queries are internal/controlled
    "N803",    # argument naming - scientific notation conventions
    "N806",    # variable naming - scientific notation conventions
    "N815",    # mixedCase in class scope - scientific constants
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "RUF013",  # implicit Optional - existing type hints
    "F821",    # undefined name - some dynamic imports
    "F601",    # repeated dict keys - some country code maps
    "S603",    # subprocess call - controlled internal tools
    "S310",    # URL open audit - internal/controlled URLs
    "E701",    # multiple statements on one line - compact scientific code
    "E702",    # multiple statements on one line (semicolon) - compact code
    "E722",    # bare except - handled by BLE001 ignore
    "E741",    # ambiguous variable name - legacy code patterns
    "S110",    # try-except-pass - existing patterns
    "S112",    # try-except-continue - existing patterns
    "RUF001",  # ambiguous unicode chars - scientific notation
    "RUF046",  # unnecessary int cast - defensive coding
    "RUF059",  # unpacked unused - intentional discard
    "UP045",   # X | None vs Optional - existing type hints
    "UP031",   # format specifiers vs % - legacy formatting
    "F841",    # unused variable - defensive/intermediate vars
    "F401",    # unused import - conditional/test imports
    "F821",    # undefined name - some dynamic imports
    "RUF100",  # unused noqa - will clean up
    "E402",    # module import not at top - existing patterns
    "S105",    # hardcoded password - config pattern
    "RUF010",  # explicit conversion flag - bool() is fine
    "RUF015",  # next(iter()) vs slice - readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"primerforge/core/thermodynamics.py" = ["N806", "RUF002", "RUF003"]
"primerforge/core/manual_analyser.py" = ["N803", "RUF001", "RUF002"]
"primerforge/core/auto_designer.py" = ["N815", "RUF013", "F841"]
"primerforge/core/sequence_fetcher.py" = ["N806", "RUF013", "F841", "S112"]
"primerforge/core/pipeline_validator.py" = ["S607"]
"primerforge/auth.py" = ["S108", "S104", "S608"]
"primerforge/visitor_routes.py" = ["F601", "S110"]
"primerforge/webhook_engine.py" = ["S104", "S110"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false  # start from loose, tighten gradually
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
