global:
  resolve_timeout: 5m

route:
  receiver: slack-alerts
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: slack-alerts
      group_wait: 10s

receivers:
  - name: slack-alerts
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} [{{ .Status | toUpper }}]"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Details:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ end }}
        actions:
          - type: button
            text: "View in Grafana"
            url: "https://grafana.vigyanllm.in/alerting"

inhibit_rules:
  - source_match:
      severity: "warning"
    target_match:
      severity: "info"
    equal: ["alertname"]
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
