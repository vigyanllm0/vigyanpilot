global:
  resolve_timeout: 5m

route:
  receiver: null-receiver
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: null-receiver
      group_wait: 10s

receivers:
  - name: null-receiver

inhibit_rules:
  - source_match:
      severity: "warning"
    target_match:
      severity: "info"
    equal: ["alertname"]
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
