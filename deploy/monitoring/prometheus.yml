global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "vigyanllm-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:11436"]
        labels:
          service: "vigyanllm"

  # Uncomment if running node-exporter on the host
  # - job_name: "node-exporter"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
