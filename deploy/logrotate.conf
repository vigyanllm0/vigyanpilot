/var/log/vigyan/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 ubuntu ubuntu
    dateext
    dateformat -%Y%m%d
    postrotate
        docker kill -s USR1 promtail 2>/dev/null || kill -HUP $(cat /var/run/promtail.pid 2>/dev/null) 2>/dev/null || true
    endscript
}
