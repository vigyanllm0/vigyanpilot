name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "frontend/**"
      - "**.md"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install -r requirements.txt --quiet
          pip install ruff mypy bandit safety pytest pytest-cov pytest-timeout --quiet

      - name: Run ruff linter
        run: ruff check primerforge/ backend/ --output-format=github

      - name: Python syntax check
        run: |
          python3 -m py_compile primerforge/primer_server.py
          python3 -m py_compile backend/main.py
          python3 -m py_compile backend/config.py

      - name: Security scan with bandit
        run: |
          bandit -r primerforge/ backend/ -f json -o bandit-report.json -q --exit-zero
          HIGH_COUNT=$(python3 -c "import json,sys; d=json.load(open('bandit-report.json')); print(len([r for r in d.get('results',[]) if r.get('issue_severity') in ('HIGH','CRITICAL')]))")
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $HIGH_COUNT HIGH/CRITICAL bandit findings — review bandit-report.json"
            exit 1
          fi

      - name: Check dependency vulnerabilities
        run: |
          # SFTY-20260902-58666 = nltk (pulled by the `safety` tool itself, not by
          # requirements.txt; nltk is never imported by app code and is not deployed).
          # Ignored for the same reason as the three entries below: not our attack surface.
          safety check --full-report --ignore SFTY-20260721-58460 --ignore 80915 --ignore 72809 --ignore SFTY-20260902-58666

      - name: Run pytest with coverage
        env:
          PRIMERFORGE_ADMIN_EMAIL: test@test.com
          PRIMERFORGE_ADMIN_PASSWORD: testpassword123
          PRIMERFORGE_SECRET: testsecretkeyforpytestthatislongenough
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          python3 -m pytest tests/ -x -q --timeout=30 --ignore=tests/test_frontend.py --ignore=tests/test_order_serializer.py --ignore=tests/test_payment_routes.py --ignore=tests/test_primer_server.py --ignore=tests/test_verification_fix.py \
            --cov=primerforge --cov-report=xml --cov-fail-under=20

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    name: Deploy to EC2
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host key
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Migration dry-run
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd ~/vigyanpilot
            source .venv/bin/activate 2>/dev/null || true
            python deploy/migrations/migrate.py --dry-run
          ENDSSH

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd ~/vigyanpilot

            # Clean up disk space before anything else
            sudo apt-get clean -y 2>/dev/null
            sudo journalctl --rotate --vacuum-size=10M 2>/dev/null
            sudo rm -rf /tmp/* 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            df -h / | tail -1

            # Add swap if not present (small file given disk constraints)
            if ! swapon --show | grep -q .; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=512 2>/dev/null
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile 2>/dev/null
              sudo swapon /swapfile 2>/dev/null || echo "Swap creation failed — continuing"
            fi

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # ── GNINA (Docking Trust Phase 1): official CPU binary + gate ──
            # v1.1 is the official CPU build — v1.3.x dynamically links
            # libcudnn/libcudart (proven by ELF NEEDED probe 2026-10-08) and
            # can never load on this GPU-less box; v1.1 has zero CUDA deps and
            # its stdout table/--cnn_scoring=rescore format was verified live.
            # Gitignored under pipelines/bin/ (survives git reset --hard;
            # fetched only when missing or version-stamped differently).
            GNINA_DIR="primerforge/pipelines/bin"
            GNINA_TAG="v1.1"
            mkdir -p "$GNINA_DIR"
            if [ "$(cat "$GNINA_DIR/.gnina_ver" 2>/dev/null)" != "$GNINA_TAG" ] || [ ! -x "$GNINA_DIR/gnina" ]; then
              FREE_MB=$(df -m / | tail -1 | awk '{print $4}')
              if [ "$FREE_MB" -lt 4000 ]; then
                echo "::error::Only ${FREE_MB}MB free on / — need >=4000MB for the 306MB gnina binary"
                exit 1
              fi
              echo "Installing gnina $GNINA_TAG (official CPU build, ~306MB)..."
              curl -fL --retry 3 --retry-delay 3 -o "$GNINA_DIR/gnina.part" \
                "https://github.com/gnina/gnina/releases/download/$GNINA_TAG/gnina"
              chmod +x "$GNINA_DIR/gnina.part"
              mv "$GNINA_DIR/gnina.part" "$GNINA_DIR/gnina"
            fi
            # HARD GATE: the binary must actually EXECUTE on this host.
            # Production once shipped a broken PATH 'gnina' (Exec format
            # error) that silently degraded every job to Vina-only — a deploy
            # must fail loudly instead of shipping that again.
            if ! GNINA_VER=$("$GNINA_DIR/gnina" --version 2>&1); then
              echo "::error::gnina will not execute on this host: $GNINA_VER"
              exit 1
            fi
            echo "gnina gate OK: $GNINA_VER"
            echo "$GNINA_TAG" > "$GNINA_DIR/.gnina_ver"

            # Create virtual env if missing
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate

            # Install pysam — prefer pre-built wheel, fall back to system package
            pip install pysam==0.23.3 --only-binary :all: --no-cache-dir --quiet 2>/dev/null || \
              (sudo apt-get update -qq && sudo apt-get install -y python3-pysam 2>/dev/null) || \
              echo "WARNING: pysam not installed — primer design will fail for some features"

            # Install libpq-dev (provides pg_config) so psycopg2 can compile from source
            # if the binary wheel is unavailable for this platform.
            sudo apt-get install -y libpq-dev 2>/dev/null || true

            # Detect package installer — uv uses different CLI flags than pip
            if command -v uv &>/dev/null; then
              # uv: use --no-cache (not --no-cache-dir); install binary wheel separately
              uv pip install psycopg2-binary==2.9.10 --only-binary :all: --quiet 2>/dev/null || \
                echo "psycopg2-binary wheel not found via uv — will build from source"
              uv pip install -r requirements.txt --quiet
              # CMS (FastAPI) deps — overlap pins (psycopg2/bcrypt) are kept
              # identical in backend/requirements.txt so this never downgrades
              # anything the main app installed above.
              uv pip install -r backend/requirements.txt --quiet
            else
              pip install psycopg2-binary==2.9.10 --only-binary :all: --no-cache-dir --quiet 2>/dev/null || \
                echo "psycopg2-binary wheel not found via pip — will build from source"
              pip install -r requirements.txt --no-cache-dir --quiet
              pip install -r backend/requirements.txt --no-cache-dir --quiet
            fi

            # Write .env file from GitHub Secrets
            : > .env
            printf '%s\n' "PRIMERFORGE_SECRET=${{ secrets.PRIMERFORGE_SECRET }}" >> .env
            printf '%s\n' "PRIMERFORGE_ADMIN_EMAIL=${{ secrets.PRIMERFORGE_ADMIN_EMAIL }}" >> .env
            printf '%s\n' "PRIMERFORGE_ADMIN_PASSWORD=${{ secrets.PRIMERFORGE_ADMIN_PASSWORD }}" >> .env
            printf '%s\n' "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            
            # Clean up DATABASE_URL if the secret contains the key prefix
            # (e.g. "DATABASE_URL=postgresql://..." instead of "postgresql://...")
            sed -i 's/^DATABASE_URL=DATABASE_URL=/DATABASE_URL=/' .env
            printf '%s\n' "FORCE_HTTPS=false" >> .env
            printf '%s\n' "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> .env
            printf '%s\n' "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> .env
            printf '%s\n' "RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" >> .env
            printf '%s\n' "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            # CMS (FastAPI :8001) — JWT_SECRET is required by backend/config.py
            # at import time; admin credential is seeded/rotated from env by
            # backend/main.py _seed_admin() (no credentials in code).
            printf '%s\n' "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            printf '%s\n' "CMS_ADMIN_EMAIL=${{ secrets.CMS_ADMIN_EMAIL }}" >> .env
            printf '%s\n' "CMS_ADMIN_PASSWORD=${{ secrets.CMS_ADMIN_PASSWORD }}" >> .env
            printf '%s\n' "MAIN_API_URL=http://127.0.0.1:11436/api" >> .env
            # CMS media → S3 (CloudFront default origin bucket). boto3 picks
            # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY up from the process env
            # (default credential chain); S3_BUCKET switches storage.py out of
            # its local-disk dev fallback.
            printf '%s\n' "S3_BUCKET=vigyanllm-frontend" >> .env
            printf '%s\n' "S3_BUCKET_REGION=ap-south-1" >> .env
            printf '%s\n' "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            printf '%s\n' "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env

            # Start PostgreSQL
            if command -v pg_isready &>/dev/null && pg_isready -q 2>/dev/null; then
              echo "PostgreSQL is running"
            elif command -v pg_ctlcluster &>/dev/null; then
              sudo pg_ctlcluster $(pg_lsclusters -h | head -1 | awk '{print $1, $2}') start 2>/dev/null || true
            elif command -v docker &>/dev/null; then
              sudo docker start vigyanpilot-postgres-1 2>/dev/null || \
                sudo docker start vigyanpilot_postgres_1 2>/dev/null || \
                echo "PostgreSQL container not found"
            else
              echo "WARNING: No PostgreSQL found — ensure DATABASE_URL points to a running instance"
            fi
            sleep 2

            # Ensure log directory exists
            sudo mkdir -p /var/log/vigyan
            sudo chown ubuntu:ubuntu /var/log/vigyan

            # Install/update systemd service
            sudo cp deploy/vigyan.service /etc/systemd/system/vigyan.service
            sudo systemctl daemon-reload
            if ! systemctl is-enabled vigyan &>/dev/null; then
              sudo systemctl enable vigyan
            fi
            echo "Updated vigyan.service"

            # Install/update the CMS unit (FastAPI on 127.0.0.1:8001) —
            # started after the main API gates below.
            sudo cp deploy/vigyan-cms.service /etc/systemd/system/vigyan-cms.service
            sudo systemctl daemon-reload
            if ! systemctl is-enabled vigyan-cms &>/dev/null; then
              sudo systemctl enable vigyan-cms
            fi
            echo "Updated vigyan-cms.service"

            # Run database migrations
            python deploy/migrations/migrate.py

            # Restart backend via systemd.
            #
            # An unmanaged gunicorn has historically held 127.0.0.1:11436, so
            # `systemctl restart vigyan` was a SILENT NO-OP: the unit's bind
            # (0.0.0.0:11436 via gunicorn.conf.py) fails with EADDRINUSE while
            # the orphaned process keeps serving pre-deploy code. Health checks
            # still passed because they hit the orphan. Take the port over
            # deliberately, then gate on the payload we just deployed.
            sudo systemctl stop vigyan 2>/dev/null || true
            sudo pkill -f 'gunicorn.*11436' 2>/dev/null || true
            sleep 3

            if ! sudo systemctl restart vigyan; then
              echo " ::warning::vigyan.service failed to start"
              sudo systemctl status vigyan --no-pager -l 2>/dev/null | tail -20 || true
            fi
            sleep 6

            # Fallback: the unit may have failed (e.g. hardening/port). Use the
            # exact invocation proven to serve production, so the deploy can
            # never leave the API down or stale.
            if ! curl -sf -m 8 http://localhost:11436/health >/dev/null 2>&1; then
              echo " ::warning::vigyan.service not serving — starting gunicorn directly"
              sudo systemctl stop vigyan 2>/dev/null || true
              setsid nohup .venv/bin/gunicorn --bind 127.0.0.1:11436 --workers 2 \
                --timeout 120 'primerforge.primer_server:create_app()' \
                > /var/log/vigyan/fallback.log 2>&1 < /dev/null &
              sleep 8
            fi

            # GATE: :11436 must serve the code we just deployed, not merely be up.
            PRICE=$(curl -sf -m 10 http://localhost:11436/api/payments/pricing || true)
            echo "pricing payload: $(echo "$PRICE" | head -c 300)"
            if ! echo "$PRICE" | .venv/bin/python -c \
                "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('currency')=='USD' else 1)" \
                2>/dev/null; then
              echo " ::error::Backend :11436 is NOT serving the deployed USD code — deploy did not take effect"
              sudo ss -ltnp 2>/dev/null | grep 11436 || true
              exit 1
            fi
            echo " OK: :11436 serving deployed code (USD pricing)"
            curl -sf http://localhost:11436/health && echo " health OK" || { echo " health FAIL"; exit 1; }

            # ── CMS (FastAPI :8001) — same deliberate port-takeover pattern ──
            # Startup seeds/rotates the admin from CMS_ADMIN_* env (backend/
            # main.py _seed_admin) and creates cms_*/admin_users tables via
            # Base.metadata.create_all — no migrations needed for these.
            sudo systemctl stop vigyan-cms 2>/dev/null || true
            sudo pkill -f 'uvicorn.*8001' 2>/dev/null || true
            sleep 2
            if ! sudo systemctl restart vigyan-cms; then
              echo " ::warning::vigyan-cms.service failed to start"
              sudo systemctl status vigyan-cms --no-pager -l 2>/dev/null | tail -20 || true
            fi
            sleep 5
            if ! curl -sf -m 8 http://127.0.0.1:8001/health >/dev/null; then
              echo " ::error::CMS :8001 health gate FAILED"
              sudo journalctl -u vigyan-cms --no-pager -n 40 2>/dev/null || true
              exit 1
            fi
            echo " OK: CMS :8001 healthy"

            # GATE: end-to-end CMS login with the configured credential.
            # Credential JSON is built from .env at runtime — no secret value or
            # issued token is ever written to the (public) workflow log.
            LOGIN_JSON=$(python3 -c "import json; env=dict(l.strip().split('=',1) for l in open('.env') if l.strip().startswith('CMS_ADMIN_') and '=' in l); print(json.dumps({'email': env.get('CMS_ADMIN_EMAIL',''), 'password': env.get('CMS_ADMIN_PASSWORD','')}))")
            CLOGIN=$(curl -s -m 10 -o /tmp/cms_login.json -w '%{http_code}' -X POST \
              http://127.0.0.1:8001/api/v1/cms/auth/login \
              -H 'Content-Type: application/json' -d "$LOGIN_JSON" || true)
            if [ "$CLOGIN" != "200" ] || ! python3 -c "import json,sys; d=json.load(open('/tmp/cms_login.json')); sys.exit(0 if d.get('token') else 1)" 2>/dev/null; then
              echo " ::error::CMS login gate FAILED (HTTP $CLOGIN) — response keys: $(python3 -c "import json; print(sorted(json.load(open('/tmp/cms_login.json')).keys()))" 2>/dev/null || echo non-JSON)"
              sudo journalctl -u vigyan-cms --no-pager -n 40 2>/dev/null || true
              exit 1
            fi
            rm -f /tmp/cms_login.json
            echo " OK: CMS login gate passed (token issued, not logged)"

            # nginx config is now versioned + idempotent (was "run once"):
            # opens /api/v1/cms/ to CloudFront origin traffic. nginx -t inside
            # the script gates a bad config before reload; a failure here fails
            # the deploy while the running nginx keeps its previous config.
            bash deploy/deploy-nginx-ec2.sh
            echo " OK: nginx config deployed (CMS API path opened)"
          ENDSSH

      - name: Health check via CloudFront
        run: |
          sleep 5
          curl -sf https://www.vigyanllm.in/health || { echo " — CloudFront health FAIL"; exit 1; }
          # SQLite schema gate (RCA 2026-10-08): a stale primerforge.db makes every
          # logged-in usage check 500 ("no such column: trial_ends_at"). Cache-busted
          # so we read the origin's fresh /health, never a CDN-cached one.
          H=$(curl -sf -m 15 "https://www.vigyanllm.in/health?cb=$(date +%s)" || true)
          if ! echo "$H" | python3 -c \
              "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('sqlite_schema_ok') is True else 1)" \
              2>/dev/null; then
            echo " — SQLite schema probe NOT ok (logged-in usage checks would 500): $(echo "$H" | head -c 300)"
            exit 1
          fi
          curl -sf https://www.vigyanllm.in/api/config/public || { echo " — API config FAIL"; exit 1; }
          # End-to-end gate: live pricing must be the USD payload we deployed.
          LIVE=$(curl -sf -m 15 "https://www.vigyanllm.in/api/payments/pricing?cb=$(date +%s)" || true)
          if ! echo "$LIVE" | python3 -c \
              "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('currency')=='USD' else 1)" \
              2>/dev/null; then
            echo " — Live pricing API is NOT serving the USD payload: $(echo "$LIVE" | head -c 200)"
            exit 1
          fi
          echo " — All endpoints OK (live pricing = USD)"

          # ── Production CMS enablement gates ──────────────────────────────
          # 1) The /cms-admin shell must be reachable at the edge again
          #    (viewer-request function updated before this push).
          CM=$(curl -sL -o /dev/null -w '%{http_code}' -m 15 https://www.vigyanllm.in/cms-admin)
          if [ "$CM" != "200" ]; then
            echo " — /cms-admin edge gate FAILED (HTTP $CM)"
            exit 1
          fi
          # 2) Full CloudFront → nginx → uvicorn login chain + an authorized
          #    read. Secrets are GitHub-interpolated (values masked in logs);
          #    the issued token is never printed.
          CMS_EMAIL='${{ secrets.CMS_ADMIN_EMAIL }}' \
          CMS_PASSWORD='${{ secrets.CMS_ADMIN_PASSWORD }}' \
          python3 - <<'PYCMS'
          import json, os, urllib.request

          def _login():
              req = urllib.request.Request(
                  "https://www.vigyanllm.in/api/v1/cms/auth/login",
                  data=json.dumps({"email": os.environ["CMS_EMAIL"],
                                   "password": os.environ["CMS_PASSWORD"]}).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, json.loads(r.read())

          def _read(token):
              req = urllib.request.Request(
                  "https://www.vigyanllm.in/api/v1/cms/pages",
                  headers={"Authorization": "Bearer " + token},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status

          status, body = _login()
          token = body.get("token") or ""
          if status != 200 or not token:
              raise SystemExit(f"live CMS login status={status} keys={sorted(body)}")
          if _read(token) != 200:
              raise SystemExit("authorized GET /api/v1/cms/pages failed")
          print(" — live CMS chain OK (login + authorized read; token not logged)")
          PYCMS

      - name: Deploy notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ Deploy succeeded for ${{ github.repository }}@${{ github.sha }}"
          else
            MSG="❌ Deploy FAILED for ${{ github.repository }}@${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          # Set SLACK_WEBHOOK_URL in GitHub Secrets
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || echo "Slack notification skipped (webhook not configured)"
