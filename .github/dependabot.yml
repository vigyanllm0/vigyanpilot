version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 10
    reviewers: []

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    target-branch: main
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
